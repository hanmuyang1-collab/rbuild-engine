[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "rbuild-engine"
version = "4.3.0"
description = "R-Build v4.3: GPU/memory-efficient engine with caller-defined from-scratch training beside non-destructive V4.1 conversion, CPT and SFT, with universal CUA, V4 draft-verify, V3 experts, memory, media, and R-Run."
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-Velandris-1.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Han Muyang" }]
keywords = ["llm", "vlm", "moe", "muon", "fast-weight-memory", "act-halting", "critic-experts", "self-training", "agentic", "cua", "computer-use", "training", "architecture", "serving", "hot-swap"]
dependencies = [
    "torch>=2.0",
]

[project.optional-dependencies]
notebook = ["ipywidgets>=8.0"]
train = ["transformers>=4.40", "datasets>=2.18"]
serve = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.0"]
vllm = ["vllm>=0.6"]
dev = ["ipywidgets>=8.0", "transformers>=4.40", "datasets>=2.18",
       "fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.0"]

[project.scripts]
rrun = "rrun.cli:main"

[project.urls]
Homepage = "https://github.com/hanmuyang1-collab/rbuild-engine"
License = "https://huggingface.co/Velandris/velandris-license/blob/main/LICENSE.md"

[tool.setuptools.packages.find]
include = ["rbuild*", "rrun*"]
