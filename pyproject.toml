[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "rbuild-engine"
version = "2.1.0"
description = "R-Build: a fully user-modifiable open-source LLM architecture and training-speed engine with VL support. Cache-loop sequential stages + parallel bundle stages, MoD routing, fine-grained MoE with shared expert, Muon optimizer, WSD schedule, chunked cross-entropy, gradient-free fast-weight memory, ViT vision tower."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "GeoThinkAI" }]
keywords = ["llm", "vlm", "moe", "muon", "fast-weight-memory", "training", "architecture"]
dependencies = [
    "torch>=2.0",
]

[project.optional-dependencies]
notebook = ["ipywidgets>=8.0"]
train = ["transformers>=4.40", "datasets>=2.18"]
dev = ["ipywidgets>=8.0", "transformers>=4.40", "datasets>=2.18"]

[project.urls]
Homepage = "https://huggingface.co/GeoThinkAI"

[tool.setuptools.packages.find]
include = ["rbuild*"]
