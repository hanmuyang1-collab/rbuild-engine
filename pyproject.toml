[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "rbuild-engine"
version = "4.0.0"
description = "R-Build v4: critic-gated adaptive LLM training with shared-embedding discrete-diffusion drafting, token-level critic verification, exact-AR fallback, accepted-token watermarking, and KL distillation — plus the complete v3 engine and R-Run serving."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "GeoThinkAI" }]
keywords = ["llm", "vlm", "moe", "muon", "fast-weight-memory", "act-halting", "critic-experts", "self-training", "agentic", "training", "architecture", "serving", "hot-swap"]
dependencies = [
    "torch>=2.0",
]

[project.optional-dependencies]
notebook = ["ipywidgets>=8.0"]
train = ["transformers>=4.40", "datasets>=2.18"]
serve = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.0"]
vllm = ["vllm>=0.6"]
dev = ["ipywidgets>=8.0", "transformers>=4.40", "datasets>=2.18",
       "fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.0"]

[project.scripts]
rrun = "rrun.cli:main"

[project.urls]
Homepage = "https://huggingface.co/GeoThinkAI"

[tool.setuptools.packages.find]
include = ["rbuild*", "rrun*"]
